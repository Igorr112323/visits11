plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.visits11.teacher'
    compileSdk 34

    defaultConfig {
        applicationId "ru.visits11.teacher"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "2.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // релиз подписываем debug-ключом — установка без магазина
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// приложение чисто на framework API — зависимостей нет
dependencies {
}
