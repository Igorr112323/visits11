plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.visits11.student'
    compileSdk 34

    defaultConfig {
        applicationId "ru.visits11.student"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // релиз подписываем debug-ключом — установка без магазина
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// приложение работает на framework API; zxing нужен только чтобы распознать
// QR-код студента из картинки галереи (вход по QR, без сервера)
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
