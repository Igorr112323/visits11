plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.visits11.student'
    compileSdk 34

    defaultConfig {
        applicationId "ru.visits11.student"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // релиз подписываем debug-ключом — установка без магазина
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// приложение работает на framework API. zxing нужен, чтобы распознать QR-код
// студента: core — из картинки галереи, embedded — камерой на экране входа.
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
