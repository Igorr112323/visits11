plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.visits11.student'
    compileSdk 34

    defaultConfig {
        applicationId "ru.visits11.student"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // релиз подписываем debug-ключом — установка без магазина
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// приложение чисто на framework API — зависимостей нет
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
