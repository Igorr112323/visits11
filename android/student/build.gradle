plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.visits11.student'
    compileSdk 34

    defaultConfig {
        applicationId "ru.visits11.student"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            // релиз подписываем debug-ключом — установка без магазина
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// приложение работает на framework API: камера — системная, экран сканирования свой.
// zxing нужен только чтобы разобрать QR-код студента (кадр камеры или картинка из галереи)
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
