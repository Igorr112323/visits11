<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КубГАУ">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<title>КубГАУ</title>
<style>
  @font-face { font-family: "Manrope"; font-weight: 500; font-display: swap; src: url("fonts/Manrope-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 700; font-display: swap; src: url("fonts/Manrope-Bold.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 22px calc(env(safe-area-inset-bottom, 0px) + 40px);
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    background: #0a0d1a; color: #f0f2fa;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 500; font-size: 17px; line-height: 1.45; text-align: center;
    -webkit-text-size-adjust: 100%;
  }
  img { width: 110px; height: 110px; }
  p { margin: 0; max-width: 360px; }
  .btn {
    display: block; width: 100%; max-width: 360px; min-height: 54px; border-radius: 14px;
    color: #fff; text-decoration: none; font-size: 17px; font-weight: 700; line-height: 54px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<img src="icons/logo.png" alt="КубГАУ" width="110" height="110">
<p id="text"></p>
<a class="btn" id="cert" href="/visits11.cer" hidden>Скачать сертификат</a>
<a class="btn" id="next" href="/" hidden>Далее</a>
<script>
(function () {
  "use strict";
  var text = document.getElementById("text");
  var cert = document.getElementById("cert");
  var next = document.getElementById("next");
  var secure = window.location.protocol === "https:";
  var standalone = false;
  try {
    standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  } catch (e) { standalone = false; }

  if (standalone) {
    window.location.replace("/");
    return;
  }

  if (secure) {
    text.textContent = "Поделиться → На экран «Домой»";
    return;
  }

  next.href = "https://" + window.location.host + "/";
  fetch("/visits11.cer", { cache: "no-store" }).then(function (response) {
    if (response.ok) {
      text.innerHTML = "1. Скачайте и установите сертификат.<br>2. Настройки → Основные → Об этом устройстве → Доверие сертификатов → включить.";
      cert.hidden = false;
    }
    next.hidden = false;
  }, function () {
    text.textContent = "Нет связи с ПК";
  });
})();
</script>
</body>
</html>
