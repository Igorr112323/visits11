<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0D1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КубГАУ Студент">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>КубГАУ Студент</title>
</head>
<body>

<!-- Разметка повторяет android/student/res/layout/activity_main.xml:
     логотип · QR на весь экран · статус · карточка входа · точка связи с ПК -->

<!-- логотип КубГАУ -->
<img class="logo" src="icons/logo.png" alt="КубГАУ" width="110" height="110">

<div class="stage">
  <!-- QR-код (обновляется с ПК каждые 5 секунд) -->
  <img class="qr" id="qrView" alt="QR" width="300" height="300" hidden>

  <!-- вход при первом запуске -->
  <div class="card" id="loginPanel" hidden>
    <input class="input" id="loginInput" type="text" placeholder="Логин"
           autocomplete="off" autocapitalize="none" autocorrect="off"
           spellcheck="false" enterkeyhint="next">
    <input class="input input-next" id="passwordInput" type="password" placeholder="Пароль"
           autocomplete="off" enterkeyhint="done">
    <button class="button" id="loginButton" type="button">Войти</button>
  </div>

  <!-- статус, когда QR показать нельзя -->
  <div class="status" id="statusText" hidden></div>
</div>

<!-- индикатор связи с ПК -->
<div class="dot" id="dot"></div>

<!-- всплывающая подсказка, как Toast в Android -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
