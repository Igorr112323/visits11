name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-win-x64
          path: publish/Visits11.exe
          if-no-files-found: error

      - name: Publish release with exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item publish/Visits11.exe "publish/Журнал КубГАУ.exe"
          gh release view v1.0.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 "publish/Журнал КубГАУ.exe" --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release delete-asset v1.0.0 Visits11.exe --yes --repo "$env:GITHUB_REPOSITORY" *> $null
            $LASTEXITCODE = 0
          } else {
            gh release create v1.0.0 "publish/Журнал КубГАУ.exe" --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY" --title "КубГАУ · Учёт посещаемости" --notes "Журнал КубГАУ — готовый single-file .exe (Windows x64, .NET 8, self-contained). Установка не требуется — скачайте и запустите. Данные (attendance.db, settings.json) создаются рядом с файлом."
          }
