name: Windows applications

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build teacher journal
        run: dotnet build Visits11.csproj -c Release

      - name: Build server
        run: dotnet build Server/Server.csproj -c Release

      - name: Verify attendance and QR behavior
        run: dotnet run --project tests/WindowsSmoke/WindowsSmoke.csproj -c Release

      - name: Publish teacher journal
        run: dotnet publish Visits11.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-journal

      - name: Publish server
        run: dotnet publish Server/Server.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-server

      - name: Smoke-test server HTTP API
        shell: pwsh
        run: ./tests/server-smoke.ps1 -Executable ./publish-server/KubGAU-Server.exe

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item publish-journal/Visits11.exe dist/KubGAU-Journal.exe
          Copy-Item publish-server/KubGAU-Server.exe dist/KubGAU-Server.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KubGAU-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
