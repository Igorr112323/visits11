name: Build Windows (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test automatic storage and legacy database migration
        run: dotnet run --project tests/StorageTests/StorageTests.csproj -c Release

      - name: Build
        run: dotnet build -c Release

      - name: Publish standalone ESP32 EXE (default mode)
        run: dotnet publish -c Release -r win-x64 -p:TerminalMode=Board -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/board

      - name: Publish phone terminal EXE
        run: dotnet publish -c Release -r win-x64 -p:TerminalMode=Phone -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/phone

      - name: Upload ESP32 EXE
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-win-x64
          path: publish/board/Visits11.exe
          if-no-files-found: error

      - name: Upload phone EXE
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-Phone-win-x64
          path: publish/phone/Visits11.exe
          if-no-files-found: error
