name: Build iOS IPA

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          # XcodeGen пишет формат Xcode 16 (objectVersion 77), а на раннере Xcode 15 — понижаем
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' Visits11Student.xcodeproj/project.pbxproj

      - name: Build unsigned app (проверка компиляции)
        working-directory: ios
        run: |
          xcodebuild -project Visits11Student.xcodeproj \
            -scheme Visits11Student \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1 || {
              grep -m 5 "error:" build.log | while read -r line; do echo "::error::$line"; done
              tail -5 build.log | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Diagnostics (схема/список)
        if: failure()
        working-directory: ios
        run: |
          xcodebuild -project Visits11Student.xcodeproj -list 2>&1 | head -14 | while read -r line; do echo "::error::LIST: $line"; done

      - name: Package unsigned .ipa (подписывается через Sideloadly своим Apple ID)
        working-directory: ios
        run: |
          brew install ldid
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/Visits11Student.app Payload/
          ldid -SSources/Visits11Student.entitlements Payload/Visits11Student.app/Visits11Student || echo "::warning::ldid не сработал, права NFC не вшиты"
          zip -qry KubGAU-Student-iOS.ipa Payload
          cp KubGAU-Student-iOS.ipa ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KubGAU-Student-iOS-ipa
          path: KubGAU-Student-iOS.ipa

      - name: Publish to release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete-asset v1.0.0 Visits11-Student-iOS-unsigned.ipa --yes --repo "$GITHUB_REPOSITORY" || true
            gh release upload v1.0.0 KubGAU-Student-iOS.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.0 KubGAU-Student-iOS.ipa \
              --title "Visits11 v1.0.0" \
              --notes "Учёт посещаемости — офлайн. Exe для ПК, APK преподавателя и студента, iOS-приложение студента." \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
