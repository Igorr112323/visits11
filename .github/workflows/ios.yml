name: iOS student application

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' Visits11Student.xcodeproj/project.pbxproj

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild -project Visits11Student.xcodeproj \
            -scheme Visits11Student \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1 || {
              grep -m 10 "error:" build.log | while read -r line; do echo "::error::$line"; done
              tail -20 build.log | while read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/Visits11Student.app Payload/
          zip -qry dist/Visits11-Student-iOS-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: KubGAU-iOS-unsigned
          path: ios/dist/Visits11-Student-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
