name: Teacher USB release v2.0.3

# This teacher-only release intentionally omits the student, iOS, and server builds.
on:
  push:
    branches:
      - arena/01a10822-visits11
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build and smoke-test Windows journal
        run: |
          dotnet build Visits11.csproj -c Release
          dotnet run --project tests/WindowsSmoke/WindowsSmoke.csproj -c Release

      - name: Publish Windows journal
        run: dotnet publish Visits11.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-journal

      - name: Prepare Windows release file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item publish-journal/Visits11.exe dist/KubGAU-Journal.exe

      - name: Upload Windows release file
        uses: actions/upload-artifact@v7
        with:
          name: teacher-windows
          path: dist/KubGAU-Journal.exe
          if-no-files-found: error
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Test and build teacher APK only
        working-directory: android
        run: gradle :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon

      - name: Prepare Android release file
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/KubGAU-Teacher.apk

      - name: Upload Android release file
        uses: actions/upload-artifact@v7
        with:
          name: teacher-android
          path: dist/KubGAU-Teacher.apk
          if-no-files-found: error
          retention-days: 3

  release:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - name: Download Windows file
        uses: actions/download-artifact@v7
        with:
          name: teacher-windows
          path: release-assets

      - name: Download Android file
        uses: actions/download-artifact@v7
        with:
          name: teacher-android
          path: release-assets

      - name: Publish teacher USB release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.3 \
            release-assets/KubGAU-Journal.exe \
            release-assets/KubGAU-Teacher.apk \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "КубГАУ · Связь преподавателя по USB v2.0.3" \
            --notes "v2.0.3: журнал Windows сам инициирует исходящие запросы к APK преподавателя через USB/RNDIS-адаптер и привязывает запросы к этому интерфейсу. Сначала проверяется адрес USB-модема, затем при необходимости — адреса его подсети. Для этой связи не требуется открывать входящий порт или добавлять исключение в брандмауэр Windows. Релиз содержит только Windows-журнал и APK преподавателя."
