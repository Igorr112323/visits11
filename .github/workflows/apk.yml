name: Build Android (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build release APKs (камера преподавателя + студент)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload teacher APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-Teacher-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload student APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-Student-apk
          path: android/student/build/outputs/apk/release/student-release.apk
