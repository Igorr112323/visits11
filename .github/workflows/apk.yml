name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build release APKs (камера преподавателя + студент)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload teacher APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-Teacher-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload student APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visits11-Student-apk
          path: android/student/build/outputs/apk/release/student-release.apk

      - name: Publish APKs to release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KubGAU-Teacher.apk
          cp android/student/build/outputs/apk/release/student-release.apk KubGAU-Student.apk
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload v1.0.0 KubGAU-Teacher.apk KubGAU-Student.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.0.0 --title "КубГАУ · Учёт посещаемости" --repo "$GITHUB_REPOSITORY" || true
            # убираем старые имена файлов — оставляем только актуальные
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
              --jq '.assets[] | (.id|tostring) + "\t" + .name' |
            while IFS=$'\t' read -r asset_id asset_name; do
              case "$asset_name" in
                KubGAU-Journal.exe|KubGAU-Teacher.apk|KubGAU-Student.apk|KubGAU-Student-iOS.ipa|Visits11-Student-iOS-unsigned.ipa) ;;
                *) gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" || true ;;
              esac
            done
          else
            gh release create v1.0.0 KubGAU-Teacher.apk KubGAU-Student.apk \
              --title "КубГАУ · Учёт посещаемости" \
              --notes "Журнал КубГАУ (ПК), КубГАУ Преподаватель и КубГАУ Студент — офлайн-учёт посещаемости." \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
