name: Android applications

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests, lint and release builds
        working-directory: android
        run: gradle testReleaseUnitTest lintRelease assembleRelease --no-daemon

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/KubGAU-Teacher.apk
          cp android/student/build/outputs/apk/release/student-release.apk dist/KubGAU-Student.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KubGAU-Android-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
